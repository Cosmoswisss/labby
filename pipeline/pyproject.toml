[project]
name = "labby-pipeline"
version = "0.1.0"
description = "Crawl and extract EPFL lab student-project pages for Labby"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
    "truststore>=0.10.5",
    "typer>=0.12",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option(...) in defaults is the documented Typer pattern
extend-immutable-calls = ["typer.Option", "typer.Argument"]
