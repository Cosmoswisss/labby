# Weekly data update: crawl -> extract (changed pages only) -> export, then open a pull
# request when data changed. Merging it publishes the new data (Vercel redeploys main).
#
# Requires the repository secret CLAUDE_CODE_OAUTH_TOKEN (created with `claude setup-token`,
# tied to a Claude subscription: no paid API key) and, in Settings > Actions > General,
# "Allow GitHub Actions to create and approve pull requests".
name: Update data

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch:
    inputs:
      max_input_tokens:
        description: "Token budget for the LLM extraction in this run"
        default: "400000"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAX_INPUT_TOKENS: ${{ github.event.inputs.max_input_tokens || '400000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: pipeline
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install Claude Code (extraction engine)
        run: npm install -g @anthropic-ai/claude-code

      - name: Check the Claude Code token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Missing secret CLAUDE_CODE_OAUTH_TOKEN (run 'claude setup-token' and add it in Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # Raw downloads are kept between runs so unchanged pages are revalidated with
      # ETag / Last-Modified instead of being downloaded again.
      - name: Restore crawl cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pipeline/cache
          key: crawl-cache-${{ github.run_id }}
          restore-keys: crawl-cache-

      - name: Install pipeline
        working-directory: pipeline
        run: uv sync --locked

      - name: Keep the current data for the summary
        run: cp data/projects.json "$RUNNER_TEMP/old_projects.json"

      - name: Crawl
        working-directory: pipeline
        run: uv run pipeline crawl

      - name: Extract (new and changed pages only)
        working-directory: pipeline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run pipeline extract --max-input-tokens "$MAX_INPUT_TOKENS"

      - name: Export
        working-directory: pipeline
        run: uv run pipeline export

      - name: Summary
        working-directory: pipeline
        run: |
          uv run pipeline diff --old "$RUNNER_TEMP/old_projects.json" --output "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data pipeline/state; then
            echo "No data change."
            exit 0
          fi
          branch="data-update/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data pipeline/state
          git commit -m "data: weekly update $(date -u +%Y-%m-%d)"
          git push --force origin "$branch"
          if gh pr view "$branch" --json number > /dev/null 2>&1; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$branch" \
              --title "Data update $(date -u +%Y-%m-%d)" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
